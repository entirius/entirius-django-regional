[project]
name = "entirius-django-regional"
version = "2.0.1"
description = "Regional reference data for Volkanos services - Country, Currency and Language models with admin API"
authors = [{ name = "Entirius" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-regional"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_regional"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"*/migrations/*.py" = ["E501"]
"tests/**" = ["S101", "S105", "S106"]
# Legacy migrated 1:1 - deferred cleanup:
"src/django_regional/models/*.py" = ["UP031", "DJ012"]

[tool.ruff.lint.isort]
known-first-party = ["django_regional"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
addopts = "--no-migrations"
